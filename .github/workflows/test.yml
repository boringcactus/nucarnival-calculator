name: test.yml
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for Svelte and TypeScript errors
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Check lints
        run: npm run lint
